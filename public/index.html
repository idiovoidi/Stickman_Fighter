<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stick Fighter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }
        canvas {
            background: #fff;
            border: 2px solid #333;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>AI Stick Fighter</h3>
        <p>Controls:</p>
        <ul>
            <li>R - Reset positions</li>
            <li>P - Pause/Resume</li>
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="js/GameWorld.js"></script>
    <script src="js/GameEngine.js"></script>
    <script src="js/InputManager.js"></script>
    <script src="js/StickMan.js"></script>
    <script src="js/AIController.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
